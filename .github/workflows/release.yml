# Builds a downloadable Cheerio.app and publishes it.
#
# Two ways in:
#   - Push a tag like v26.8.1 → tests run, a Release build is made, and a GitHub
#     Release is created with the zipped app attached.
#   - Run manually (workflow_dispatch) → same build, but the zip is uploaded as
#     a workflow artifact instead of a release. Useful for trying a build of
#     main without cutting a version.
#
# Tagging: versions are CalVer (calver.org), scheme YY.MM.MICRO — tag
# v<YY>.<M>.<BUILD>, e.g. v26.8.1 for the first release cut in August 2026.
# YY and M come straight off the calendar and are never zero-padded (v26.8.1,
# not v26.08.01 — the "Determine version" step below rejects a padded month
# outright). BUILD is a per-month counter you pick by hand when cutting the
# tag: check the previous release for the current YY.M and increment it, or
# start at 1 if this is the first tag of the month; a new month always resets
# BUILD back to 1 (v26.9.1 follows v26.8.1, whatever BUILD that reached).
# CFBundleVersion is a separate number — see the comment on that step for why
# it stays the run number regardless of what the tag says.
#
# "Determine version" also checks that YY.M matches the UTC date of the
# commit the tag points at. That check has no override switch on purpose: a
# mismatch is essentially always a typo, and the fix is the same either way —
# cut a new tag whose YY.M matches the day you're actually releasing.
#
# The app is signed with a Developer ID certificate and notarized by Apple, so
# Gatekeeper opens it without ceremony. Hardened runtime stays on; the sandbox
# stays off (see CLAUDE.md — a sandboxed build records silence).
#
# Automatic updates (Sparkle) ride along on a tag push:
#
#   1. the notarized, stapled zip is built and packaged as it always was;
#   2. Sparkle's generate_appcast EdDSA-signs that exact zip and folds an entry
#      for it into the previous release's feed, downloaded from the stable
#      releases/latest/download URL — the minimum system version comes from the
#      app's own LSMinimumSystemVersion (macOS 26), and the release notes are a
#      short embedded fragment linking to the GitHub release;
#   3. a guard step re-verifies the signature in that entry against the zip's
#      bytes with sign_update --verify, and refuses to publish if it doesn't
#      match — a bad appcast must not be able to ship quietly;
#   4. the GitHub Release is created with *both* assets at once — the zip and
#      appcast.xml. The enclosure URL in that feed points at this release's own
#      zip, so it resolves the moment the release exists: one operation, no
#      window in which the feed advertises a download that isn't there yet;
#   5. that is the whole publish. The app's SUFeedURL is
#      https://github.com/ObviosCo/cheerio/releases/latest/download/appcast.xml,
#      which GitHub 302-redirects to the newest release's asset (Sparkle follows
#      redirects), so attaching the asset *is* publishing the feed.
#
# Why not commit the feed to main and serve it from Pages, as this workflow used
# to: main has branch protection, so the GITHUB_TOKEN write fails — and it fails
# *after* the release already exists, leaving the feed unpublished and the run
# unresumable, because `gh release create` won't run twice. More generally a
# release run has no business writing to a branch at all; it should only ever
# add artifacts to the thing it is publishing.
#
# Manual (workflow_dispatch) runs do steps 2 and 3 as a dry run and attach the
# appcast to the workflow artifacts. No release is created and nothing is
# published, so the appcast pipeline can be exercised without cutting a version.
#
# Required repository secrets:
#   DEVELOPER_ID_P12_BASE64    — base64 of the Developer ID Application .p12
#   DEVELOPER_ID_P12_PASSWORD  — password protecting that .p12
#   NOTARY_KEY_P8              — App Store Connect API private key (.p8 contents)
#   NOTARY_KEY_ID              — that key's Key ID
#   NOTARY_ISSUER_ID           — the team's Issuer ID (App Store Connect →
#                                Users and Access → Integrations)
#   SPARKLE_ED_PRIVATE_KEY     — Sparkle's EdDSA (ed25519) update-signing key
#
# One-time setup for that last secret, which only a maintainer can do — the
# private key must never be committed, and no automation here generates one:
#
#   1. Resolve the packages once (./Scripts/bootstrap.sh, then a build in Xcode)
#      and run Sparkle's key generator from the resolved artifact:
#        ./SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys
#      It stores the private key in your login keychain and prints the public one.
#      (It also lives in the Sparkle-*.tar.xz on Sparkle's GitHub releases.)
#   2. Export the private key and paste its contents into the
#      SPARKLE_ED_PRIVATE_KEY repository secret:
#        ./…/bin/generate_keys -x sparkle-private-key.txt
#      Then delete the file. Keep the keychain copy; it is the only backup, and
#      losing it means no existing install can ever be updated again.
#   3. Paste the printed public key into SUPublicEDKey in Cheerio/Info.plist,
#      replacing REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY, and commit that.
#
# The "Verify Sparkle signing key" step below refuses to release until 2 and 3
# have both been done and agree with each other: signing with a key the shipped
# app doesn't trust produces a perfectly valid appcast that every installed copy
# rejects, silently and permanently.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # contents: to create the release and attach the zip and appcast to it. Nothing
  # else is needed — no branch writes, and no workflow dispatching.
  contents: write

# One fixed group across every ref, not one per tag. Nothing is committed any more,
# but the feed is still shared mutable state: every run reads the *current* latest
# release's appcast and writes that feed plus its own entry to a new latest (minus
# anything past generate_appcast's --maximum-versions). Two tags released
# concurrently would both seed from the same older feed, and whichever finished
# second would become "latest" while missing the other's entry. Serializing all
# release runs — regardless of tag — through one group is what keeps that
# read-modify-write safe.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    # One place for the signing identity: xcodebuild signs the app with it, and the
    # Sparkle re-signing step below has to use the *same* one, or the app's seal and
    # its nested code would disagree about who signed them.
    env:
      DEVELOPER_ID: "Developer ID Application: Jackson Miller (HXGV36NV7T)"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache diarization model
        uses: actions/cache@v6
        with:
          path: Cheerio/Resources/Models
          key: model-${{ hashFiles('Scripts/fetch-models.sh') }}

      # project.yml is hashed too: Sparkle is declared there, not in Package.swift,
      # and the cache holds the binary artifact its version resolves to — including
      # the generate_appcast and sign_update this workflow runs below.
      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('CheerioKit/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-app-${{ runner.os }}-

      # Never ship what fails its own tests.
      - name: Run package tests
        run: swift test --package-path CheerioKit

      - name: Bootstrap (fetch model, generate project)
        run: ./Scripts/bootstrap.sh

      # Tag v1.2.3 → CFBundleShortVersionString 1.2.3; the run number becomes
      # the build number so re-runs of the same tag stay distinguishable.
      # Manual runs keep the version already in Info.plist and get a -<sha>
      # suffix on the zip instead.
      #
      # download_prefix is where Sparkle will be told to fetch the update from. On a
      # tag that is the release asset this run is about to attach; on a manual run
      # it is a URL that deliberately doesn't exist, because nothing is published.
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"

            # CalVer (calver.org): YY.MM.MICRO. The month group deliberately
            # excludes a leading zero — (1[0-2]|[1-9]) matches 1-12 but not
            # "08" — and BUILD is a positive, unpadded counter ([1-9][0-9]*):
            # the first release of a month is .1, and "v26.8.01" is not an
            # alias for it. One canonical spelling per version, everywhere.
            if [[ ! "$tag" =~ ^v([0-9]{2})\.(1[0-2]|[1-9])\.([1-9][0-9]*)$ ]]; then
              echo "::error::Tag '${tag}' isn't in this repo's version scheme: CalVer YY.MM.BUILD, tagged vYY.MM.BUILD (e.g. v26.8.1 for the first release cut in August 2026). YY and MM come from the calendar and are never zero-padded (v26.8.1, not v26.08.01); BUILD is a per-month counter you choose by hand — see this workflow's header comment. Fix: cut a tag matching that shape."
              exit 1
            fi
            tag_year="${BASH_REMATCH[1]}"
            tag_month="${BASH_REMATCH[2]}"

            # Sanity-check YY.MM against the UTC date of the commit the tag
            # points at. This is a guard against a mistyped tag, not a switch
            # to flip deliberately — there is no override. `^{commit}` so it
            # resolves an annotated tag's own object to the commit it wraps.
            commit_sha="$(git rev-parse "${tag}^{commit}")"
            commit_ts="$(git show -s --format=%ct "$commit_sha")"
            commit_year="$(date -u -r "$commit_ts" +%y)"
            # $((10#...)) forces base-10 so a month like "08" isn't read as
            # invalid octal.
            commit_month=$((10#$(date -u -r "$commit_ts" +%m)))
            if [[ "$tag_year" != "$commit_year" || "$tag_month" -ne "$commit_month" ]]; then
              echo "::error::Tag '${tag}' claims ${tag_year}.${tag_month}, but the commit it points at was made on 20${commit_year}-${commit_month} (UTC). That's almost certainly a typo, not an intentional backdated release, so there's no override. Fix: cut a new tag whose YY.MM matches the commit's actual UTC date."
              exit 1
            fi

            version="${tag#v}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${version}" Cheerio/Info.plist
            suffix="${version}"
            prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
            notes_link="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          else
            suffix="$(git rev-parse --short HEAD)"
            version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Cheerio/Info.plist)"
            prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/dry-run/"
            notes_link="https://github.com/${GITHUB_REPOSITORY}/releases"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Cheerio/Info.plist
          {
            echo "suffix=${suffix}"
            echo "short_version=${version}"
            echo "download_prefix=${prefix}"
            echo "notes_link=${notes_link}"
          } >> "$GITHUB_OUTPUT"

      # The signing keychain is temporary and throwaway: a random password,
      # deleted in the always() cleanup step. The G2 intermediate ships inside
      # Xcode and is imported alongside the identity because a Keychain
      # Access-exported .p12 carries only the leaf — without the intermediate,
      # codesign can't build the chain and reports "no identity found".
      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security import "$(dirname "$(xcode-select -p)")/SharedFrameworks/DVTFoundation.framework/Versions/A/Resources/DeveloperIDCA-G2.cer" \
            -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security find-identity -v -p codesigning "$KEYCHAIN"

      # --timestamp gets a secure timestamp from Apple so the signature
      # outlives the certificate; notarization requires it.
      # CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO stops xcodebuild from adding
      # get-task-allow (the debugger entitlement) — `build` injects it even
      # in Release, and the notary service rejects any binary carrying it.
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cheerio.xcodeproj \
            -scheme Cheerio \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            | xcbeautify --renderer github-actions

      # Sparkle's helper tools ship *pre-signed by the Sparkle project*, and signing
      # an app does not re-sign the code nested inside it — so Updater.app,
      # Autoupdate and the XPC services reach the notary carrying someone else's
      # certificate and no secure timestamp. Apple rejects each by name
      # ("not signed with a valid Developer ID certificate", "signature does not
      # include a secure timestamp"); that is what run 31274611820 hit.
      #
      # Signing order is inside-out and not negotiable: a signature seals everything
      # nested within it, so signing an outer bundle first is invalidated the moment
      # anything inside it is re-signed. Sparkle's own guidance
      # (sparkle-project.org/documentation/sandboxing/) gives the sequence used here:
      # XPC services → Autoupdate → Updater.app → Sparkle.framework. The app itself
      # follows, because re-signing the framework broke the app's seal over it.
      #
      # Two details from that guidance:
      #   - Downloader.xpc (Sparkle ≥ 2.6, and we pin 2.9.5) carries its own
      #     entitlements, so it is signed with --preserve-metadata=entitlements;
      #     re-signing plain would strip them.
      #   - No --deep, for the same reason: one blanket recursive signature would
      #     flatten the app's entitlements onto every nested binary.
      # The app's own entitlements have to be passed explicitly on its signature —
      # codesign does not carry over what xcodebuild applied.
      - name: Re-sign Sparkle's nested code
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Cheerio.app"
          sparkle="$app/Contents/Frameworks/Sparkle.framework"
          test -d "$sparkle" \
            || { echo "::error::Sparkle.framework missing from the built app; nothing to re-sign"; exit 1; }

          # --timestamp: the secure timestamp the notary requires.
          # --options runtime: hardened runtime, likewise required.
          # --force: these are already signed; without it codesign refuses.
          sign() {
            codesign --force --timestamp --options runtime --sign "$DEVELOPER_ID" "$@"
          }

          signed=()
          for service in Installer Downloader; do
            target="$sparkle/Versions/B/XPCServices/${service}.xpc"
            # Which XPC services ship has varied across Sparkle versions, so presence
            # is checked rather than assumed. Everything below this loop is mandatory.
            if [ ! -d "$target" ]; then
              echo "No ${service}.xpc in this Sparkle build; nothing to sign there."
              continue
            fi
            if [ "$service" = Downloader ]; then
              sign --preserve-metadata=entitlements "$target"
            else
              sign "$target"
            fi
            signed+=("$target")
          done

          for target in \
            "$sparkle/Versions/B/Autoupdate" \
            "$sparkle/Versions/B/Updater.app" \
            "$sparkle"; do
            test -e "$target" || { echo "::error::Expected Sparkle component missing: $target"; exit 1; }
            sign "$target"
            signed+=("$target")
          done

          # The app last, now that its framework has a new signature underneath it.
          sign --entitlements Cheerio/Cheerio.entitlements "$app"
          signed+=("$app")

          # Assert each component now has all three things the notary checks for,
          # instead of learning it from Apple twenty minutes later.
          for target in "${signed[@]}"; do
            info="$(codesign -dvv "$target" 2>&1)"
            grep -q "Authority=Developer ID Application" <<<"$info" \
              || { echo "::error::${target} is not signed with Developer ID"; exit 1; }
            grep -q "^Timestamp=" <<<"$info" \
              || { echo "::error::${target} has no secure timestamp"; exit 1; }
            grep -q "flags=.*runtime" <<<"$info" \
              || { echo "::error::${target} is not hardened-runtime signed"; exit 1; }
            echo "Signed: $target"
          done

      - name: Verify app bundle
        run: |
          app="build/Build/Products/Release/Cheerio.app"
          codesign --verify --strict --verbose=2 "$app"
          # Catch a silent fallback to ad-hoc or development signing.
          # (-dvv, not -dv: Authority lines only appear at verbosity ≥ 2.)
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
            || { echo "::error::App is not signed with Developer ID"; exit 1; }
          # The notary service rejects the debugger entitlement outright;
          # catch it here rather than after a round-trip to Apple.
          if codesign -d --entitlements - "$app" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::App carries get-task-allow; notarization would reject it"
            exit 1
          fi
          # The diarization model must ship inside the app: nothing in the capture
          # or processing path may need the network, so it cannot be fetched later.
          test -d "$app/Contents/Resources/Sortformer_v2.1.mlmodelc" \
            || { echo "::error::Sortformer model missing from app bundle"; exit 1; }
          # The model is CC BY 4.0 and FluidAudio is Apache-2.0 with BSD-licensed
          # parts — the notices (including the full Apache license text, which
          # its §4(a) requires as a copy, and fastcluster's BSD notice) must
          # travel with any redistributed build. Check content, not just
          # existence, so a gutted file can't slip through.
          notices="$app/Contents/Resources/THIRD-PARTY-NOTICES.md"
          test -f "$notices" \
            || { echo "::error::THIRD-PARTY-NOTICES.md missing from app bundle"; exit 1; }
          for needle in "CC BY 4.0" "Apache License" "TERMS AND CONDITIONS FOR USE, REPRODUCTION, AND DISTRIBUTION" "fastcluster" "BUT Speech@FIT" "Sparkle" "Andy Matuschak"; do
            grep -q "$needle" "$notices" \
              || { echo "::error::THIRD-PARTY-NOTICES.md is missing: $needle"; exit 1; }
          done
          # Sparkle has to be embedded and separately signed, not just linked: its
          # updater and installer are nested bundles inside the framework, and an
          # unsigned or wrongly-signed one fails notarization or refuses to install
          # anything at runtime. The re-signing step above gave each of them our own
          # Developer ID signature; this proves the framework is actually in the
          # bundle rather than silently dropped, and that re-signing it inside-out
          # left both it and the app's seal over it intact. --deep so the nested
          # Updater.app and XPC services are walked explicitly rather than by
          # default-behaviour assumption.
          test -d "$app/Contents/Frameworks/Sparkle.framework" \
            || { echo "::error::Sparkle.framework missing from app bundle; updates would not work"; exit 1; }
          codesign --verify --strict --deep --verbose=2 "$app/Contents/Frameworks/Sparkle.framework"
          # Apple Silicon only — a stray Intel slice means ARCHS drifted.
          archs="$(lipo -archs "$app/Contents/MacOS/Cheerio")"
          [ "$archs" = "arm64" ] \
            || { echo "::error::Expected arm64 only, got: $archs"; exit 1; }

      # Before the notary round trip, because this is the mistake that cannot be
      # taken back: an app shipped trusting public key A, updated with a feed signed
      # by key B, rejects every update from then on — silently, on every install,
      # fixable only by asking people to download the app again by hand.
      #
      # Ed25519 public keys are derived from the private seed, so the two can be
      # compared without ever putting the private key anywhere but this shell.
      - name: Verify Sparkle signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          app="build/Build/Products/Release/Cheerio.app"
          # `|| true` so a plist with no SUPublicEDKey at all reaches the message
          # below instead of dying on PlistBuddy's exit code.
          embedded="$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$app/Contents/Info.plist" 2>/dev/null || true)"
          if [ -z "$embedded" ] || [ "$embedded" = "REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::SUPublicEDKey in Cheerio/Info.plist is still the placeholder. See this workflow's header for the one-time key setup."
            exit 1
          fi
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is not set. See this workflow's header."
            exit 1
          fi
          # macOS ships LibreSSL as /usr/bin/openssl, which won't do ed25519 key
          # derivation; Homebrew's OpenSSL 3 will, and is present on the runner image.
          openssl_bin=""
          for candidate in "$(brew --prefix openssl@3 2>/dev/null || true)/bin/openssl" \
                           /opt/homebrew/opt/openssl@3/bin/openssl \
                           /usr/local/opt/openssl@3/bin/openssl; do
            if [ -x "$candidate" ] && "$candidate" version | grep -q '^OpenSSL 3'; then
              openssl_bin="$candidate"
              break
            fi
          done
          [ -n "$openssl_bin" ] || { echo "::error::No OpenSSL 3 on the runner; cannot derive the EdDSA public key"; exit 1; }
          secret_hex="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode | xxd -p | tr -d '\n')"
          case "${#secret_hex}" in
            64)
              # Current generate_keys format: the secret is the 32-byte private seed.
              # Wrapping it in the PKCS#8 prefix for ed25519 lets openssl do the
              # scalar multiplication for us.
              printf '302e020100300506032b657004220420%s' "$secret_hex" | xxd -r -p > "$RUNNER_TEMP/ed25519.der"
              spki_hex="$("$openssl_bin" pkey -inform DER -in "$RUNNER_TEMP/ed25519.der" -pubout -outform DER | xxd -p | tr -d '\n')"
              rm -f "$RUNNER_TEMP/ed25519.der"
              public_hex="${spki_hex: -64}"
              ;;
            192)
              # Keys generated by older Sparkle: private key concatenated with public.
              public_hex="${secret_hex: -64}"
              ;;
            *)
              echo "::error::SPARKLE_ED_PRIVATE_KEY is not a Sparkle EdDSA key (decoded to $((${#secret_hex} / 2)) bytes; expected 32 or 96)"
              exit 1
              ;;
          esac
          derived="$(printf '%s' "$public_hex" | xxd -r -p | base64)"
          if [ "$derived" != "$embedded" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY does not match SUPublicEDKey in the built app. Updates signed by this key would be rejected by every install."
            exit 1
          fi
          echo "Signing key matches the app's SUPublicEDKey."

      # Submit for notarization, then staple the ticket to the app so
      # Gatekeeper can verify it offline — fitting for an app with no
      # network access. The final zip is made *after* stapling.
      - name: Notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          app="build/Build/Products/Release/Cheerio.app"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          notary() {
            xcrun notarytool "$@" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --output-format json
          }
          # submit and wait are separate calls so the submission ID survives a
          # wait timeout — on timeout, notarytool prints only to stderr, and a
          # combined submit --wait leaves you with no ID to fetch the log for.
          notary submit "$RUNNER_TEMP/notarize.zip" > "$RUNNER_TEMP/submit.json"
          sub_id="$(jq -r .id "$RUNNER_TEMP/submit.json")"
          echo "Submission ID: $sub_id"
          # Apple's queue is usually minutes but can run long, especially for
          # a team's first submissions; 30m has timed out in practice.
          notary wait "$sub_id" --timeout 2h > "$RUNNER_TEMP/verdict.json" || true
          status="$(jq -r .status "$RUNNER_TEMP/verdict.json" 2>/dev/null || echo unknown)"
          echo "Notary verdict: $status"
          # On rejection, surface Apple's per-file reasons — "status: Invalid"
          # alone is useless for debugging.
          if [ "$status" != "Accepted" ]; then
            notary log "$sub_id" || true
            echo "::error::Notarization verdict: $status"
            exit 1
          fi
          xcrun stapler staple "$app"
          # The end-to-end proof: Gatekeeper itself accepts the app.
          spctl --assess --type execute --verbose=2 "$app"

      # ditto (not zip) preserves symlinks, resource forks, and extended
      # attributes — a plain zip can produce a bundle codesign rejects.
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/Cheerio.app \
            "Cheerio-${{ steps.version.outputs.suffix }}.zip"

      # Sparkle's generate_appcast signs the zip and folds an entry for it into the
      # feed. Notes worth knowing:
      #
      # - The tools come from the resolved Sparkle package, so they are always the
      #   same version as the framework inside the app.
      # - The starting feed is downloaded from the live SUFeedURL, not read out of this
      #   checkout: the published feed is the only place the previous releases' entries
      #   exist, and starting from anything staler would drop older versions out of it.
      #   The fallback covers exactly two cases — the first release ever, and a repo
      #   whose latest release predates this mechanism and so has no appcast asset —
      #   where that URL 404s and site/appcast.xml's empty template is the right seed.
      # - Seeding works because generate_appcast re-uses an appcast it finds *in the
      #   archives directory* and only adds to it. Verified against the pinned 2.9.5
      #   binary: with a directory holding nothing but the new zip plus the previous
      #   feed, the older entries survive with their edSignature and their original
      #   enclosure URL intact — --download-url-prefix applies to new entries only, so
      #   an old entry keeps pointing at the release it actually shipped from. Entries
      #   are pruned by count (--maximum-versions, default 3 per branch point), never
      #   by whether their archive is still on disk. This is why -o has to name a path
      #   *inside* the archives directory passed as the argument: point it elsewhere
      #   and the seed is never read, and every release publishes a one-item feed.
      # - The zip's neighbouring .html file becomes the entry's release notes.
      #   Without DOCTYPE or body tags, generate_appcast embeds it as CDATA, so
      #   Sparkle needs no second request to show it.
      # - minimumSystemVersion is not passed here. generate_appcast reads it out of
      #   the app's own LSMinimumSystemVersion (macOS 26); the verify step below
      #   asserts it came out right.
      # - --maximum-deltas 0 because delta updates would need every previous zip on
      #   disk, and CI keeps none. Full downloads only.
      - name: Generate appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          tool="$(find SourcePackages/artifacts -type f -name generate_appcast | head -1)"
          [ -x "$tool" ] || { echo "::error::generate_appcast not found in the resolved Sparkle package"; exit 1; }
          mkdir -p appcast
          feed_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          # Only a definitive 404 means "there is no previous feed". Anything else —
          # a timeout, a TLS or DNS failure, a rate limit, a 5xx — has to stop the run,
          # because seeding from the empty template on a transport failure would
          # publish an appcast that silently drops every previous release's entry.
          # Installs still on an older version would then see a feed that no longer
          # mentions any upgrade path they can take.
          #
          # -L because the stable releases/latest/download URL 302-redirects to the
          # current latest release's own asset; %{http_code} reports the code of the
          # *last* transfer, so what we capture is the status after redirects, not the
          # 302. No -f: a nonzero exit would hide the status we want to name.
          # --retry 3 --retry-all-errors so genuinely transient failures retry before
          # being called failures.
          set +e
          status="$(curl -sSL --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 180 \
            -w '%{http_code}' -o appcast/appcast.xml "$feed_url")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ]; then
            echo "::error::Could not read the published appcast at ${feed_url}: curl exited ${curl_rc} (HTTP status: ${status:-none}). Refusing to seed an empty feed — that would drop every previous release's entry."
            exit 1
          fi
          case "$status" in
            200)
              echo "Seeded from the published appcast (HTTP 200)."
              ;;
            404)
              # The only two legitimate cases: the first release ever, and a repo whose
              # latest release predates this mechanism and so has no appcast asset.
              echo "No published appcast yet (HTTP 404); seeding from the empty template in site/."
              cp site/appcast.xml appcast/appcast.xml
              ;;
            *)
              echo "::error::Unexpected HTTP ${status} fetching ${feed_url}. Only 404 means 'no previous feed'; refusing to seed an empty appcast on a ${status}, which would drop every previous release's entry."
              exit 1
              ;;
          esac
          cp "Cheerio-${{ steps.version.outputs.suffix }}.zip" appcast/
          cat > "appcast/Cheerio-${{ steps.version.outputs.suffix }}.html" <<EOF
          <h2>Cheerio ${{ steps.version.outputs.short_version }}</h2>
          <p>Everything still runs on your Mac. Requires macOS 26 or later on Apple Silicon.</p>
          <p><a href="${{ steps.version.outputs.notes_link }}">Full release notes on GitHub</a></p>
          EOF
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$tool" \
            --ed-key-file - \
            --download-url-prefix "${{ steps.version.outputs.download_prefix }}" \
            --link "https://obviosco.github.io/cheerio/" \
            --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases" \
            --maximum-deltas 0 \
            -o appcast/appcast.xml \
            appcast

      # The guard. generate_appcast exits 0 after merely *warning* that it could not
      # sign a build, so "it ran" proves nothing — this is what proves the entry
      # describes this zip, and that the signature in it verifies against these
      # bytes. Runs on manual builds too, which is the dry run: a broken appcast
      # pipeline is found without cutting a tag.
      - name: Verify appcast against the built zip
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # The zip at the repo root, not the copy in appcast/ — this is the exact
          # file the release attaches, and the signature has to match those bytes.
          zip="Cheerio-${{ steps.version.outputs.suffix }}.zip"
          signature="$(python3 Scripts/verify-appcast.py \
            appcast/appcast.xml "$zip" \
            --short-version "${{ steps.version.outputs.short_version }}" \
            --bundle-version "${GITHUB_RUN_NUMBER}" \
            --url "${{ steps.version.outputs.download_prefix }}Cheerio-${{ steps.version.outputs.suffix }}.zip")"
          # sign_update derives the public key from the private one and checks the
          # signature against the file, so this is the same arithmetic a user's copy
          # of Sparkle will do before it installs anything.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" \
            | "$(find SourcePackages/artifacts -type f -name sign_update -not -path '*old_dsa*' | head -1)" \
              --verify --ed-key-file - "$zip" "$signature"
          echo "Appcast entry verifies against ${zip}."

      # This *is* the publish, for both the app and its update feed: the zip and
      # appcast.xml go on as assets of the same release, in one call. The feed's
      # enclosure URL points at this release's own zip, so there is no moment where
      # a published feed advertises a download that doesn't exist yet.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Install

          1. Download `Cheerio-*.zip` below and unzip it.
          2. Move `Cheerio.app` to `/Applications` and open it.

          The app is signed with a Developer ID certificate and notarized by
          Apple — no security warnings, no extra steps.

          Requires **macOS 26 (Tahoe) or later on Apple Silicon** — there is
          no Intel build. Everything runs on-device: transcription, speaker
          names and notes never leave your Mac. No accounts, no analytics.

          Later versions install themselves: the app checks this release feed
          for updates, and nothing else. You can turn that off, or switch on
          automatic installs, in **Settings → Updates**.

          The app bundles the Sortformer diarization model (© NVIDIA,
          [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)) — full
          attribution in `THIRD-PARTY-NOTICES.md` inside the app bundle.
          EOF
          zip="Cheerio-${{ steps.version.outputs.suffix }}.zip"
          # If the release already exists, this is a re-run after something failed
          # later on, and `create` refuses. The re-run still has to be able to finish
          # the job — a release whose feed was never attached is worse than useless —
          # but it must do so by *adding* what is missing, never by replacing what is
          # already out there.
          #
          # A published Sparkle asset is immutable. Clients hold the appcast they last
          # fetched, and it names the zip's URL alongside an EdDSA signature over that
          # zip's exact bytes. Replacing the zip under a URL some client already has
          # signed makes every such client fail the signature check — and even for
          # clients that refetch, there is a window in which the appcast and the zip
          # are a mismatched pair. So: upload only missing assets, and if the zip is
          # already published, prove the local one is byte-identical before continuing.
          if ! gh release create "${GITHUB_REF_NAME}" \
            "$zip" \
            appcast/appcast.xml \
            --title "Cheerio ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag; then
            echo "gh release create failed; checking whether the release already exists."
            # Fails the step if `create` broke for any reason other than the release
            # already being there (auth, network, a bad tag).
            gh release view "${GITHUB_REF_NAME}" > /dev/null
            published="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"

            if grep -qxF "$zip" <<<"$published"; then
              # Same name, already published. Byte-identical is the only safe answer.
              # Note a re-run of the same tag normally is *not* identical: CFBundleVersion
              # is the run number, so the app inside differs. That is precisely the case
              # this must refuse rather than clobber.
              mkdir -p "$RUNNER_TEMP/published"
              gh release download "${GITHUB_REF_NAME}" \
                --pattern "$zip" --dir "$RUNNER_TEMP/published" --clobber
              if cmp -s "$zip" "$RUNNER_TEMP/published/$zip"; then
                echo "$zip is already published and byte-identical; leaving it untouched."
              else
                echo "::error::${zip} is already published on ${GITHUB_REF_NAME} with different bytes ($(wc -c <"$RUNNER_TEMP/published/$zip" | tr -d ' ') published vs $(wc -c <"$zip" | tr -d ' ') local; sha256 $(shasum -a 256 "$RUNNER_TEMP/published/$zip" | cut -d' ' -f1) vs $(shasum -a 256 "$zip" | cut -d' ' -f1))."
                echo "::error::A published, signed asset can never be replaced: appcasts already fetched by clients carry an EdDSA signature over the published bytes, and swapping the file under that URL breaks every one of them. Cut a new tag instead."
                exit 1
              fi
            else
              echo "$zip is not published yet; uploading it."
              gh release upload "${GITHUB_REF_NAME}" "$zip"
            fi

            # The feed is the asset a partial failure most often leaves missing, since
            # it went on in the same call as the zip. Upload it if absent; if it is
            # already there it was published by the run that produced the matching zip,
            # so it is left alone for the same immutability reason.
            if grep -qxF appcast.xml <<<"$published"; then
              echo "appcast.xml is already published; leaving it untouched."
            else
              echo "appcast.xml is not published yet; uploading it."
              gh release upload "${GITHUB_REF_NAME}" appcast/appcast.xml
            fi
          fi
          echo "Released ${GITHUB_REF_NAME} with the zip and appcast.xml attached."

      # Manual runs publish nothing, so the appcast rides along with the zip. It is
      # the dry run's output: read it, or feed it to a local Sparkle test app.
      - name: Upload build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Cheerio-${{ steps.version.outputs.suffix }}
          path: |
            Cheerio-${{ steps.version.outputs.suffix }}.zip
            appcast/appcast.xml
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip" "$RUNNER_TEMP/ed25519.der"
