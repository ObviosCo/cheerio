# Photographs the app's screens on a PR that changes them, and puts the pictures in
# the PR.
#
# Copilot's review instructions already ask whether the site's screenshots need
# updating; this is what makes that answerable without a reviewer building the branch.
#
# The mechanism, and why it's this one: capture runs inside `xcodebuild test` as
# `CheerioScreenshotTests`, a UI-testing bundle. The local harness
# (`Scripts/screenshots/capture.sh`) shoots windows with `screencapture -l`, which is
# gated by Screen Recording — a permission a runner has nobody to grant, and which
# fails by handing back a black frame rather than an error. A test host's own
# screenshot API isn't reaching into another process's window, so it isn't gated the
# same way. Everything else is shared with the local harness: the same seeded demo
# store, the same `ScreenshotMode` launch arguments.
#
# The pictures go to the orphan `screenshots` branch and into one sticky comment.
# That branch is disposable history — see Scripts/screenshots/ci/publish-branch.sh.
name: Screen previews

on:
  pull_request:
    paths:
      - "Cheerio/Views/**"
      - "Cheerio/*.swift"
      - "site/**"
      - "CheerioScreenshotTests/**"
      - "Scripts/screenshots/**"
      - ".github/workflows/screenshots.yml"
  # For refreshing the site's imagery from main without opening a PR to do it.
  workflow_dispatch:

# contents: write to push the captures to the screenshots branch; pull-requests: write
# for the sticky comment. A PR from a fork gets a read-only token regardless of what's
# asked for here, which is what the `publishable` check below is really testing.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture screens
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Both halves of the harness agree on this path — it's also the fallback
      # baked into CheerioScreenshotTests for when the TEST_RUNNER_ forwarding
      # below doesn't reach the test process.
      SCREENSHOT_HOME: /tmp/cheerio-screenshots-home
      MARKER: "<!-- screenshot-previews -->"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache diarization model
        uses: actions/cache@v6
        with:
          path: Cheerio/Resources/Models
          key: model-${{ hashFiles('Scripts/fetch-models.sh') }}

      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('CheerioKit/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-app-${{ runner.os }}-

      # The seeder is its own SwiftPM package depending on CheerioKit by path, so it
      # resolves and builds FluidAudio all over again if this misses.
      - name: Cache SwiftPM (demo store seeder)
        uses: actions/cache@v6
        with:
          path: Scripts/screenshots/SeedDemoStore/.build
          key: spm-seed-${{ runner.os }}-${{ hashFiles('CheerioKit/Package.swift', 'Scripts/screenshots/SeedDemoStore/Package.swift') }}
          restore-keys: |
            spm-seed-${{ runner.os }}-

      - name: Bootstrap (fetch model, generate project)
        run: ./Scripts/bootstrap.sh

      # Compiles the app and the test bundle and launches neither, which is what
      # keeps the slow half of this job out of the part that has to hold a GUI.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Cheerio.xcodeproj \
            -scheme CheerioScreenshots \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/screenshots \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # The same seeder the local harness runs. Nothing in the store came from a real
      # meeting, which is the condition on publishing these at all.
      - name: Seed the demo store
        run: ./Scripts/screenshots/seed-store.sh --home "$SCREENSHOT_HOME"

      # `continue-on-error` because a surface that fails to photograph shouldn't cost
      # the reviewer the ones that worked. The extraction step below is what fails the
      # job when *nothing* came out, and the summary at the end says so either way.
      - name: Capture
        id: capture
        continue-on-error: true
        env:
          # xcodebuild forwards TEST_RUNNER_-prefixed variables to the test runner
          # with the prefix stripped, which is the only channel into a UI test's
          # process.
          TEST_RUNNER_CHEERIO_SCREENSHOT_HOME: ${{ env.SCREENSHOT_HOME }}
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Cheerio.xcodeproj \
            -scheme CheerioScreenshots \
            -destination 'platform=macOS' \
            -derivedDataPath build/screenshots \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath "$RUNNER_TEMP/screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Extract the captures
        run: |
          ./Scripts/screenshots/ci/extract-screenshots.sh \
            --xcresult "$RUNNER_TEMP/screenshots.xcresult" \
            --out "$RUNNER_TEMP/screenshots"

      # Downloadable whether or not the branch push happens, which is the whole
      # story for a fork's PR.
      - name: Upload the captures
        uses: actions/upload-artifact@v7
        with:
          name: screens-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error

      # A fork's PR gets a read-only GITHUB_TOKEN however this workflow's permissions
      # are written, so pushing and commenting would both fail. Everything above still
      # ran, and the artifact above is the fallback.
      - name: Can this run publish?
        id: publishable
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "prefix=manual/${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "prefix=pr-${PR_NUMBER}/${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "prefix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the screenshots branch
        if: steps.publishable.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./Scripts/screenshots/ci/publish-branch.sh \
            --dir "$RUNNER_TEMP/screenshots" \
            --prefix "${{ steps.publishable.outputs.prefix }}" \
            --prune-repo "${{ github.repository }}"

      - name: Comment on the pull request
        if: steps.publishable.outputs.value == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./Scripts/screenshots/ci/render-comment.sh \
            --dir "$RUNNER_TEMP/screenshots" \
            --raw-base "https://raw.githubusercontent.com/${{ github.repository }}/screenshots/${{ steps.publishable.outputs.prefix }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --marker "$MARKER" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > "$RUNNER_TEMP/comment.md"
          ./Scripts/screenshots/ci/post-comment.sh \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --marker "$MARKER" \
            --body-file "$RUNNER_TEMP/comment.md"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Screen previews"
            echo
            if [ "${{ steps.capture.outcome }}" != "success" ]; then
              echo "- The capture pass reported a failure; whatever it did photograph is still below."
            fi
            if [ "${{ steps.publishable.outputs.value }}" = "true" ]; then
              echo "- Published under \`${{ steps.publishable.outputs.prefix }}\` on the \`screenshots\` branch."
            else
              echo "- Not published: a pull request from a fork gets a read-only token, so this run can"
              echo "  neither push to the \`screenshots\` branch nor comment. The captures are attached"
              echo "  to this run as an artifact instead."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
