# XcodeGen config — run `xcodegen generate` to produce Cheerio.xcodeproj
# Install: brew install xcodegen
name: Cheerio
options:
  # TODO: change to your reverse-DNS prefix. Note this does NOT set the app's
  # identifier on its own — PRODUCT_BUNDLE_IDENTIFIER below is set explicitly and
  # wins, so change both or you'll still build as app.cheerio.mac.
  bundleIdPrefix: app.cheerio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple Silicon only — no Intel slice, even in Release (which would
    # otherwise build universal). Sortformer runs on the Neural Engine, so an
    # x86_64 build was never going to perform anyway.
    ARCHS: arm64
packages:
  CheerioKit:
    path: CheerioKit
  # Automatic updates for a Developer ID app distributed outside the App Store.
  # Pinned exactly, like FluidAudio: the updater is the one component that, if it
  # regresses, can break every installed copy at once. Sparkle ships as a binary
  # xcframework, so `exactVersion` also pins the checksum SwiftPM verifies.
  # Bumping this version invalidates the SwiftPM caches in ci.yml and
  # release.yml, which key on project.yml for exactly that reason.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5
# Declared explicitly so the scheme exists without opening Xcode — headless
# xcodebuild (CI) can't use the schemes the Xcode UI auto-generates.
schemes:
  Cheerio:
    build:
      targets:
        Cheerio: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  Cheerio:
    type: application
    platform: macOS
    sources:
      - path: Cheerio
        excludes:
          - Resources/Models
      # Folder reference so the compiled .mlmodelc is copied verbatim. Fetched by
      # Scripts/fetch-models.sh (run by the pre-build phase below), never committed.
      - path: Cheerio/Resources/Models/Sortformer_v2.1.mlmodelc
        type: folder
        buildPhase: resources
      # CC BY 4.0 requires attribution to travel with the model, so the notices
      # file ships inside the app bundle.
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    preBuildScripts:
      - script: "\"$SRCROOT/Scripts/fetch-models.sh\""
        name: Fetch diarization model
        basedOnDependencyAnalysis: false
    dependencies:
      - package: CheerioKit
      - package: Sparkle
      # The bundled MCP server (issue #28), copied to Contents/Helpers/ so it
      # installs and versions with the app. "Wrapper" is the .app itself, and a
      # subpath under it is the only way to reach Helpers — Xcode's named
      # destinations cover MacOS, Resources and Frameworks but not this one.
      # Contents/MacOS would also work; Helpers keeps MacOS holding exactly one
      # executable, so nothing can mistake the helper for the app's main binary.
      # codeSign matters: a nested executable has its own signature, and an
      # unsigned one fails notarization for the whole bundle.
      - target: cheerio-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cheerio.mac
        # Hand-maintained, not generated (GENERATE_INFOPLIST_FILE is off below), so
        # there are no `info:` properties here to add keys to. Sparkle's settings —
        # including the SUPublicEDKey slot a maintainer has to fill in once — live in
        # that file. See .github/workflows/release.yml's header for the key ceremony.
        INFOPLIST_FILE: Cheerio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Cheerio/Cheerio.entitlements
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false

  # Read-only MCP server over stdio, so local agents can query meeting history.
  # A separate process, not a mode of the app: an MCP client owns its lifetime and
  # its pipes. It links CheerioKit and nothing else — no MCP SDK, and so no
  # networking code (see docs/ARCHITECTURE.md for why that was decided on
  # evidence rather than preference).
  cheerio-mcp:
    type: tool
    platform: macOS
    sources:
      - path: CheerioMCP
    dependencies:
      - package: CheerioKit
    settings:
      base:
        PRODUCT_NAME: cheerio-mcp
        # No Info.plist, embedded or otherwise. The helper reports the *app's*
        # version by reading Contents/Info.plist two directories up, and giving it
        # one of its own would also give it a CFBundleIdentifier — which would make
        # Bundle.main.bundleIdentifier resolve to the helper and send anything
        # deriving a container path from it to the wrong directory.
        GENERATE_INFOPLIST_FILE: false
        CREATE_INFOPLIST_SECTION_IN_BINARY: false
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
