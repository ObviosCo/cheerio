# XcodeGen config — run `xcodegen generate` to produce Cheerio.xcodeproj
# Install: brew install xcodegen
name: Cheerio
options:
  # TODO: change to your reverse-DNS prefix. Note this does NOT set the app's
  # identifier on its own — PRODUCT_BUNDLE_IDENTIFIER below is set explicitly and
  # wins, so change both or you'll still build as app.cheerio.mac.
  bundleIdPrefix: app.cheerio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Apple Silicon only — no Intel slice, even in Release (which would
    # otherwise build universal). Sortformer runs on the Neural Engine, so an
    # x86_64 build was never going to perform anyway.
    ARCHS: arm64
packages:
  CheerioKit:
    path: CheerioKit
# Declared explicitly so the scheme exists without opening Xcode — headless
# xcodebuild (CI) can't use the schemes the Xcode UI auto-generates.
schemes:
  Cheerio:
    build:
      targets:
        Cheerio: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  Cheerio:
    type: application
    platform: macOS
    sources:
      - path: Cheerio
        excludes:
          - Resources/Models
      # Folder reference so the compiled .mlmodelc is copied verbatim. Fetched by
      # Scripts/fetch-models.sh (run by the pre-build phase below), never committed.
      - path: Cheerio/Resources/Models/Sortformer_v2.1.mlmodelc
        type: folder
        buildPhase: resources
    preBuildScripts:
      - script: "\"$SRCROOT/Scripts/fetch-models.sh\""
        name: Fetch diarization model
        basedOnDependencyAnalysis: false
    dependencies:
      - package: CheerioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cheerio.mac
        INFOPLIST_FILE: Cheerio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Cheerio/Cheerio.entitlements
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
